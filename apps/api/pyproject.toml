[project]
name = "avp-api"
version = "0.1.0"
description = "AI Virtual Patient backend (FastAPI): agents, guardrails, sessions, jobs."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Practice-report PDF + QR (Slice 9, AVP-105).
    "fpdf2>=2.8",
    "qrcode[pil]>=7.4",
    # Supabase JWT verification via JWKS, RS256/ES256 (Slice 10, AVP-106; ADR-0008).
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
# Installed only when using the Gemini LLM provider; tests/CI use the fake.
llm = ["google-genai>=1.0"]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avp_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses Depends()/Header()/etc. as argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The initial migration embeds verbatim reference DDL (docs/specs/schema.sql).
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
