openapi: 3.1.0
# Design-time API contract skeleton, agreed in AVP-005 (see docs/adr/0011).
# This is the source of truth UNTIL apps/api exists (AVP-006); after that the
# live FastAPI schema generated by `make gen-client` takes over and must stay
# consistent with the decisions recorded here. Shapes marked (skeleton) are
# intentionally minimal and are fixed in AVP-008/012/013/014/019.
info:
  title: AI Virtual Patient API
  version: 0.1.0-skeleton
  description: >
    REST + WebSocket backend for the Vietnamese virtual-patient simulator.
    All business logic and data access live here (ADR-0001, ADR-0007).
servers:
  - url: /api/v1
    description: All REST endpoints are served under /api/v1.

tags:
  - name: health
  - name: sessions
  - name: evaluation
  - name: debrief

security:
  - supabaseBearer: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness/readiness probe (AVP-037). No auth.
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /sessions:
    post:
      tags: [sessions]
      summary: Create a practice session for one case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCreate" }
      responses:
        "201":
          description: Session created.
          headers:
            X-Guest-Token:
              description: >
                Returned only for guest sessions; the client must send it back as
                the X-Guest-Token header to access this session later.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      tags: [sessions]
      summary: List the caller's sessions (history).
      description: >
        Signed-in users see their own sessions; guests pass X-Guest-Token to see
        theirs. Ownership is enforced server-side (ADR-0007, ADR-0008).
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "200":
          description: Session list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionSummary" }
        "401": { $ref: "#/components/responses/Error" }

  /sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/GuestToken"
    get:
      tags: [sessions]
      summary: Get one session (metadata + transcript).
      responses:
        "200":
          description: Session detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{id}/turns:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/GuestToken"
    post:
      tags: [sessions]
      summary: Submit one student turn, get the patient reply (hot path).
      description: >
        Text turn loop. The hot path uses one cached system prompt per case, no
        RAG, no blocking DB write before the reply (ADR-0002). Voice turns go over
        the WebSocket; see the x-websocket note below.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TurnCreate" }
      responses:
        "200":
          description: Patient reply.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Turn" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /sessions/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/GuestToken"
    post:
      tags: [sessions]
      summary: End the interview and enqueue cold-path evaluation + debrief.
      description: >
        Idempotent. Enqueues `jobs` rows for the Evaluator then Debriefing agents
        (ADR-0002, ADR-0004). Requires consent to have been given at creation.
      responses:
        "200":
          description: Session finished (or already finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{id}/evaluation:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/GuestToken"
    get:
      tags: [evaluation]
      summary: Get the OSCE evaluation result (practice feedback only).
      description: >
        LLM proposes, code scores (ADR-0009). Every met criterion cites a turn and
        a verbatim quote. Output is learning feedback, never a certificate
        (ADR-0010). 202 while the cold-path job is still running.
      responses:
        "200":
          description: Evaluation ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluation" }
        "202":
          description: Evaluation not ready yet (job pending).
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{id}/debrief:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/GuestToken"
    get:
      tags: [debrief]
      summary: Get the debrief with citations (cold path, RAG).
      description: >
        Every claim is cited or marked unverified (ADR-0005). 202 while pending.
      responses:
        "200":
          description: Debrief ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Debrief" }
        "202":
          description: Debrief not ready yet (job pending).
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{id}/debrief/pdf:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/GuestToken"
    get:
      tags: [debrief]
      summary: Download practice report PDF with QR verification code.
      description: >
        Generates and returns an A4 PDF document containing the student score breakdown,
        verified citations, red flag alerts, and a QR code linking to online verification.
      responses:
        "200":
          description: PDF document stream.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "202":
          description: Report not ready yet (evaluation or debrief pending).
        "409":
          description: Session not finished, or the evaluation/debrief failed (REPORT_UNAVAILABLE).
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/GuestToken"
    post:
      tags: [sessions]
      summary: Perform an examination action (raycasting on 3D avatar) or clinical intervention.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalActionCreate" }
      responses:
        "200":
          description: Action performed and findings returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalActionResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{id}/vitals:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/GuestToken"
    get:
      tags: [sessions]
      summary: Get the current vitals snapshot from the state machine.
      responses:
        "200":
          description: Current vitals state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VitalsSnapshot" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me:
    get:
      tags: [me]
      summary: Current user's profile (created on first sight, role student). Signed-in only (AVP-108).
      responses:
        "200":
          description: Profile. The email is never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [me]
      summary: Update display_name (stripped, at most 80 characters; empty clears it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /sessions/{session_id}/claim:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/GuestToken"
    post:
      tags: [me]
      summary: >
        Move a guest session to the signed-in caller (needs the session's X-Guest-Token).
        One transaction sets user_id and clears guest_token_hash. Idempotent for the owner;
        a wrong token or another user's session is 404 and nothing changes (T-AUTH-02).
      responses:
        "200":
          description: Claimed (or already owned by the caller).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

# WebSocket is not expressible in OpenAPI; documented here as the agreed contract.
x-websocket:
  /ws/sessions/{id}:
    summary: Voice/text turn loop (ADR-0011).
    auth: >
      First message after connecting (never in the URL): {"type":"auth","access_token":"<JWT>"}
      when signed in, or {"type":"auth","token":"<guest token>"} for a guest session.
    note: A bad token or a session the caller does not own closes the socket with 1008.

components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token; FastAPI verifies it via JWKS (ADR-0008).

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuestToken:
      name: X-Guest-Token
      in: header
      required: false
      description: Unguessable token for guest-owned sessions (ADR-0008).
      schema: { type: string }

  responses:
    Error:
      description: Error (one shape for all failures, ADR-0011).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: session_not_found }
            message: { type: string }

    SessionCreate:
      type: object
      required: [case_id, mode, consent]
      properties:
        case_id: { type: string, description: Case id in data/cases/. }
        mode:
          type: string
          enum: [text, voice]
          description: voice is Layer P2.
        consent:
          type: boolean
          description: >
            Student consent to store/use the transcript (CLAUDE.md rule 6).
            Must be true to evaluate the session.

    Session:
      type: object
      required: [id, case_id, mode, status, created_at, turns]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string }
        mode: { type: string, enum: [text, voice] }
        status: { type: string, enum: [active, finished] }
        created_at: { type: string, format: date-time }
        consented_at: { type: [string, "null"], format: date-time }
        turns:
          type: array
          items: { $ref: "#/components/schemas/Turn" }

    SessionSummary:
      type: object
      description: (skeleton) list view; fixed in AVP-023.
      required: [id, case_id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string }
        status: { type: string, enum: [active, finished] }
        created_at: { type: string, format: date-time }
        score_summary: { type: [string, "null"] }

    TurnCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The student's utterance (size-limited, ADR-0011).

    Turn:
      type: object
      required: [turn_idx, role, text]
      properties:
        turn_idx: { type: integer, description: 0-based position in the transcript. }
        role: { type: string, enum: [student, patient] }
        text: { type: string }
        created_at: { type: string, format: date-time }

    Evaluation:
      type: object
      description: (skeleton) fixed in AVP-013/014; see docs/specs/evaluation.md.
      required: [rubric_version, total, criteria, is_practice_feedback]
      properties:
        rubric_version: { type: string }
        total: { type: number }
        max_total: { type: number }
        is_practice_feedback:
          type: boolean
          description: Always true; never an official assessment (ADR-0010).
        criteria:
          type: array
          items: { $ref: "#/components/schemas/CriterionResult" }

    CriterionResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [met, partial, not_met] }
        score: { type: number }
        evidence:
          type: [object, "null"]
          description: Required when status is met; verified by code (ADR-0009).
          properties:
            turn_idx: { type: integer }
            quote: { type: string, description: Verbatim student quote. }

    Debrief:
      type: object
      description: >
        Fixed in AVP-019 (generated FastAPI schema `DebriefResponse` is the source of
        truth). 5-tier summary + claims; a claim is verified only if it has a citation
        that resolved to a retrieved source chunk (T-RAG-01/02).
      required: [status, session_id, items, practice_feedback_only, notice]
      properties:
        status: { type: string, enum: [pending, done, failed] }
        session_id: { type: string }
        id: { type: string, nullable: true }
        evaluation_id: { type: string, nullable: true }
        summary:
          type: object
          nullable: true
          required: [expected_approach, rationale, learning_points,
                     acceptable_alternatives, important_errors]
          properties:
            expected_approach: { type: string }
            rationale: { type: string }
            learning_points: { type: array, items: { type: string } }
            acceptable_alternatives: { type: string }
            important_errors: { type: array, items: { type: string } }
        critical_missed: { type: boolean, nullable: true }
        model: { type: string, nullable: true }
        prompt_version: { type: string, nullable: true }
        embedding_model: { type: string, nullable: true }
        sources_reviewed:
          type: boolean
          description: false while any cited source is a draft (not clinician-reviewed).
        error: { type: string, nullable: true, description: Safe Vietnamese message. }
        practice_feedback_only: { type: boolean }
        notice: { type: string }
        items:
          type: array
          items:
            type: object
            required: [text, verified, citations]
            properties:
              text: { type: string }
              criterion_id: { type: string, nullable: true }
              verified:
                type: boolean
                description: false ⇒ marked unverified instead of cited (ADR-0005).
              citations:
                type: array
                items:
                  type: object
                  required: [source_id, chunk_id, document_title, section,
                             quote_excerpt, review_status]
                  properties:
                    source_id: { type: string, description: Stable document key. }
                    chunk_id: { type: string }
                    document_title: { type: string }
                    publisher: { type: string, nullable: true }
                    year: { type: integer, nullable: true }
                    section: { type: string }
                    quote_excerpt: { type: string, description: Copied from the stored chunk. }
                    review_status: { type: string, enum: [draft, clinician_reviewed] }

    ClinicalActionCreate:
      type: object
      required: [action_type, target_region]
      properties:
        action_type:
          type: string
          enum: [examine, palpate, auscultate, measure_vitals, order_medication]
        target_region:
          type: string
          description: Anatomy region id (e.g. palm_hands, feet, mouth_throat, buttocks_knees).
        parameters:
          type: object
          additionalProperties: true

    ClinicalActionResult:
      type: object
      required: [action_id, findings]
      properties:
        action_id: { type: string }
        findings: { type: string, description: Description of physical findings. }
        image_url: { type: string, nullable: true }
        audio_url: { type: string, nullable: true }
        turn_recorded: { type: integer, description: Associated turn index. }

    Me:
      type: object
      required: [user_id, display_name, role, created_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: [string, "null"], maxLength: 80 }
        role: { type: string, enum: [student, instructor, admin] }
        created_at: { type: string, format: date-time }

    MeUpdate:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name: { type: [string, "null"], maxLength: 80 }

    ClaimResponse:
      type: object
      required: [session_id, status]
      properties:
        session_id: { type: string, format: uuid }
        status: { type: string, enum: [claimed, already_owned] }

    VitalsSnapshot:
      type: object
      required: [temperature_c, heart_rate_bpm, respiratory_rate_bpm, blood_pressure_sys, blood_pressure_dia, spo2_percent, clinical_state]
      properties:
        temperature_c: { type: number, example: 39.2 }
        heart_rate_bpm: { type: integer, example: 142 }
        respiratory_rate_bpm: { type: integer, example: 32 }
        blood_pressure_sys: { type: integer, example: 95 }
        blood_pressure_dia: { type: integer, example: 65 }
        spo2_percent: { type: integer, example: 97 }
        clinical_state:
          type: string
          enum: [GRADE_1, GRADE_2A_BASELINE, GRADE_2A_HIGH_FEVER, GRADE_2B_PROGRESSION, STABILIZED]
        updated_at: { type: string, format: date-time }
